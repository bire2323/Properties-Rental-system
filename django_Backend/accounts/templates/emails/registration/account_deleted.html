<!DOCTYPE html>
<html lang="en">

<body style="margin:0;padding:24px;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
    <table role="presentation" width="100%"
        style="max-width:600px;margin:auto;background:#fff;border-radius:12px;padding:32px;">
        <tr>
            <td>
                <h1 style="color:#0b2141;">Your account was deleted</h1>
                <p>Hi {{ user_name }},</p>
                <p>Your {{ site_name }} account has been deleted by an administrator.</p>
                {% if deleted_by_email %}<p>Administrator contact: {{ deleted_by_email }}</p>{% endif %}
                <p><strong>Deleted account email:</strong> {{ email }}</p>
            </td>
        </tr>
    </table>
</body>

</html>
