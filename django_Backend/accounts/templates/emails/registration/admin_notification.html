<!DOCTYPE html>
<html lang="en">

<body style="margin:0;padding:24px;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
    <table role="presentation" width="100%"
        style="max-width:600px;margin:auto;background:#fff;border-radius:12px;padding:32px;">
        <tr>
            <td>
                <h1 style="color:#0b2141;">New user registration</h1>
                <p>A new user has successfully registered on {{ site_name }}.</p>
                <p><strong>Name:</strong> {{ registered_name }}<br><strong>Email:</strong> {{ registered_email
                    }}<br><strong>Account type:</strong> {{ role }}</p>
            </td>
        </tr>
    </table>
</body>

</html>
