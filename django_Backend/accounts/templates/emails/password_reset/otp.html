<!DOCTYPE html>
<html lang="en">

<body style="margin:0;padding:24px;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
    <table role="presentation" width="100%"
        style="max-width:600px;margin:auto;background:#fff;border-radius:12px;padding:32px;">
        <tr>
            <td>
                <h1 style="color:#0b2141;font-size:22px;">Reset your password</h1>
                <p>Hi {{ user_name }},</p>
                <p>Enter this 6-digit code to reset your {{ site_name }} password:</p>
                <p
                    style="padding:16px;text-align:center;background:#f9fafb;border:1px dashed #d1d5db;border-radius:10px;font-size:36px;font-weight:bold;letter-spacing:8px;color:#0b2141;">
                    {{ code }}</p>
                <p style="color:#6b7280;">This code expires in {{ expiry_minutes }} minutes.</p>
                <p style="color:#6b7280;">If you did not request a password reset, you can safely ignore this email.</p>
            </td>
        </tr>
    </table>
</body>

</html>
